; ================================================================
;  PlatformIO Configuration — ESP32 Door Relay (Real Hardware)
; ================================================================
;
;  Mở project này trong PlatformIO:
;    File > Open Folder > chọn thư mục door_relay_real/
;
;  Build & Upload:
;    Click nút "Build" (✓) hoặc "Upload" (→) trên thanh PlatformIO
;    Hoặc dùng terminal: pio run -t upload
;
;  Serial Monitor:
;    Click biểu tượng ổ cắm, hoặc: pio device monitor
; ================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Tốc độ Serial Monitor
monitor_speed = 115200

; Tốc độ nạp firmware (có thể giảm xuống 115200 nếu lỗi upload)
upload_speed = 921600

; ── Partition Scheme ──────────────────────────────────────────────
; min_spiffs: app0=1.9MB, app1=1.9MB (hỗ trợ OTA), spiffs=~190KB
; Cần thiết vì BLE + WiFi + SSL chiếm ~1.5MB flash
board_build.partitions = min_spiffs.csv

; ── Thư viện ──────────────────────────────────────────────────────
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2
    ; BLE (BLEDevice, BLEServer...) đã có sẵn trong ESP32 Arduino Core
    ; WiFi, WiFiClientSecure cũng built-in

; ── Build flags ───────────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=1      ; 0=off 1=error 2=warn 3=info 4=debug 5=verbose
    -DBOARD_HAS_PSRAM=0

; ── CPU & Flash ───────────────────────────────────────────────────
board_build.f_cpu   = 240000000L   ; 240 MHz
board_build.f_flash = 80000000L    ; 80 MHz flash
board_build.flash_mode = dio

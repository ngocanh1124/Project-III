<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản Lý Nhân Sự</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👥 Quản Lý Nhân Sự</h2>
        <div>
            <span class="fw-bold me-3 text-secondary" th:if="${user != null}">🏢 <span th:text="${user.org.name}"></span></span>
            <a href="/" class="btn btn-outline-primary">⬅ Về Trang Điểm Danh</a>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">➕ Thêm Nhân Viên Mới</h5>
                </div>
                <div class="card-body">
                    <form action="/employees/add" method="post">
                        <div class="mb-3">
                            <label>Họ và Tên</label>
                            <input type="text" name="name" class="form-control" required th:value="${preloadName}">
                        </div>
                        <div class="mb-3">
                            <label>Số CCCD</label>
                            <input type="text" name="cccd" class="form-control" required th:value="${preloadCccd}">
                        </div>
                        <div class="mb-3">
                            <label>Chức Vụ</label>
                            <input type="text" name="position" class="form-control" placeholder="Vd: Kế toán">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Lưu Nhân Viên</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Họ Tên</th>
                                <th>CCCD</th>
                                <th>Chức Vụ</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="emp : ${employees}">
                                <td th:text="${emp.id}"></td>
                                <td th:text="${emp.name}" class="fw-bold"></td>
                                <td th:text="${emp.cccd}"></td>
                                <td th:text="${emp.position}"></td>
                                <td>
                                    <a th:href="@{/employees/delete/{id}(id=${emp.id})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Bạn chắc chắn muốn xóa nhân viên này?')">
                                        🗑 Xóa
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

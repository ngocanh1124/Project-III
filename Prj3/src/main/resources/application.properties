# Load secrets từ .env.properties (không commit lên git - xem .env.example để biết cách tạo)
spring.config.import=optional:file:./.env.properties

# 1. Kết nối MySQL (Khớp với DATABASE attendance_db bạn đã tạo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (production-grade tuning)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# 2. Cấu hình JPA / Hibernate
# Development: update (tự tạo/sửa bảng khi thêm entity)
# Production:  validate (chỉ kiểm tra, không sửa schema - an toàn hơn)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 3. Cấu hình MQTT (HiveMQ Cloud - Để ra lệnh cho App Android)
mqtt.broker.url=${MQTT_BROKER_URL}
mqtt.client.id=attendance_server_backend_${java.net.InetAddress.getLocalHost().getHostName()}
mqtt.broker.username=${MQTT_USERNAME}
mqtt.broker.password=${MQTT_PASSWORD}
mqtt.topic.prefix=cccd/devices
mqtt.topic.unlock=cccd/devices/unlock

# 4. Cấu hình Face Recognition AI Service
face-ai.server.url=http://localhost:5000
face-ai.server.timeout=30
face-ai.server.retries=2
face-ai.comparison.threshold.primary=0.72
# L2b so selfie vs chip CCCD (ảnh chip CCCD Việt Nam cũ/nén → InsightFace buffalo_sc cho score 0.30-0.55 là bình thường)
face-ai.comparison.threshold.backup=0.60

# 5. Upload file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 6. Server ports
# Port 8080: Web dashboard + tất cả API có JWT
# Port 8081: Android device port (cao tải - ghi điểm danh)
server.port=8080


server.tomcat.connection-timeout=30000
server.tomcat.max-connections=5000

# 7. Mail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# 8. Logging (enterprise-grade structured logging)
logging.level.root=WARN
logging.level.prj3.example.Prj3=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n
logging.file.name=logs/attendance-system.log
logging.file.max-size=50MB
logging.file.max-history=30

# 10. CORS — danh sách origin được phép (SecurityConfig.java đọc biến này)
# Thêm IP server thật khi deploy, ví dụ: http://192.168.1.50:3000,https://yourdomain.com
cors.allowed.origins=http://localhost:3000,http://localhost:5000

# 9. Actuator (health check, metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Attendance System
info.app.version=2.0.0
info.app.description=Face Recognition Attendance with 2-Layer Auth + RBAC

# 10. JWT Secret (đặt trong .env.properties - không hardcode)
# Tạo secret mới: openssl rand -base64 48
jwt.secret=${JWT_SECRET}